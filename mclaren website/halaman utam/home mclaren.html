<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Background</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial;
    }

    video {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
    }

    .btn {
      padding: 10px 20px;
      background: orange;
      border: none;
      cursor: pointer;
    }

    .cookie {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #444;
      color: white;
      padding: 15px;
    }
  </style>
</head>
<body>

<video autoplay muted loop id="bg-video">
  <source src="14052063-hd_1920_1080_25fps.mp4" type="video/mp4">
  <source src="13127658_1920_1080_24fps.mp4" type="video/mp4">
</video>

<style>
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}
</style>

<div class="overlay">
  <h1>Welcome</h1>
  <button class="btn">Explore</button>
</div>

<div class="cookie">
  This site uses cookies
  <button onclick="this.parentElement.style.display='none'">Accept</button>
</div>

</body>
</html>
