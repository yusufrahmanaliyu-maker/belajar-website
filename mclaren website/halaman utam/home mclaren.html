<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luxury Navbar</title>
  <link rel="stylesheet" href="mxclaren css2.css">
</head>
<body>

  <!-- Video Background -->
  <video autoplay muted id="bg-video">
    <source src="../msn/videos/mclaren video home.mp4" type="video/mp4" id="video-source">
  </video>

  <style>
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
  </style>

  <header class="navbar">
    <div class="nav-left">
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <nav class="nav-center">
      <a href="home mclaren.html">HOME</a>
      <a href="../msn/msn.html">EXPLORE</a>
      <a href="#">AUTOMOTIVE</a>
      <a href="#">ANNOUNCEMENT</a>
      <a href="#">ABOUT US</a>  
    </nav>

    <div class="nav-right">
      <img src="../msn/videos/MCLAREN LOGO.png" alt="Logo">
    </div>
  </header>

  <style>
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
    }
  </style>

  <div class="overlay">
    <h1>Welcome</h1>
  </div>

  <script>
    const videoPlayer = document.getElementById('bg-video');
    const videoSource = document.getElementById('video-source');

    // Daftar video disesuaikan dengan folder msn/videos/
    const playlist = [
      "../msn/videos/mclaren video home.mp4"
    ];

    let currentVideoIndex = 0;

    videoPlayer.onended = function() {
      currentVideoIndex++;
      if (currentVideoIndex >= playlist.length) {
        currentVideoIndex = 0;
      }
      videoSource.src = playlist[currentVideoIndex];
      videoPlayer.load();
      videoPlayer.play();
    };
  </script>

</body>
</html>
