<!DOCTYPE html>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url('') no-repeat center/cover;
  color: white;
}

/* overlay biar gelap */
.overlay {
  background: rgba(0,0,0,0.6);
  min-height: 100vh;
  padding: 20px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
}

/* CARD */
.card {
  background: #1e1e1e;
  border-radius: 15px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

/* TEXT */
.card p {
  padding: 10px;
  font-size: 14px;
}

/* SLIDER */
.slider {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
}

.slides {
  display: flex;
  transition: 0.5s;
}

.slide {
  min-width: 100%;
}

.slide img {
  width: 100%;
  height: 250px;
  object-fit: cover;
}

.slider-text {
  position: absolute;
  bottom: 20px;
  left: 20px;
  font-size: 18px;
}

/* tombol slider */
.btn-slide {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.5);
  border: none;
  color: white;
  padding: 10px;
  cursor: pointer;
}

.prev { left: 10px; }
.next { right: 10px; }

</style>
</head>

<script>
let index = 0;
const slides = document.getElementById("slides");

function showSlide() {
  slides.style.transform = "translateX(" + (-index * 100) + "%)";
}

function next() {
  index = (index + 1) % 3;
  showSlide();
}

function prev() {
  index = (index - 1 + 3) % 3;
  showSlide();
}

/* auto geser */
setInterval(next, 3000);
</script>
